<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kgBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <!-- Dark Obsidian Background -->
  <rect width="512" height="512" rx="128" fill="#07090e"/>
  <!-- Neon Accent Border -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#kgBorderGrad)" stroke-width="24"/>
  <!-- KG Monogram -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="230" letter-spacing="-8">
    <text x="145" y="335" fill="#FFFFFF" text-anchor="middle">K</text>
    <text x="355" y="335" fill="#00D4FF" text-anchor="middle">G</text>
  </g>
</svg>
